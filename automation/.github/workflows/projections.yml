name: projections
on:
  schedule:
    - cron: "0 22 * * 4"     # Thu 5pm Central (summer time)
    - cron: "0 23 * * 4"     # Thu 5pm Central (winter time)
    - cron: "0 15 * * 0"     # Sun 10am Central (summer time)
    - cron: "0 16 * * 0"     # Sun 10am Central (winter time)
  workflow_dispatch:          # manual run from the Actions tab always runs
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Only continue at 5pm Thu / 10am Sun Chicago time
        id: gate
        run: |
          now=$(TZ=America/Chicago date +"%u-%H")      # e.g. 4-17 = Thursday 17:00
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$now" = "4-17" ] || [ "$now" = "7-10" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "skipping ($now Chicago time)"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'true'
        with: { python-version: "3.12", cache: pip }
      - name: Run model and push results
        if: steps.gate.outputs.go == 'true'
        run: |
          pip install -r requirements.txt
          python weekly_projections.py --season 2026
          mkdir -p output/snapshots
          for f in projections_*.csv; do cp "$f" "output/snapshots/$(date -u +%F_%H)_$f"; done
          mv projections_*.csv game_projections_*.csv opportunities_*.csv output/ || true
          git config user.name "projections-bot"
          git config user.email "bot@users.noreply.github.com"
          git add output
          git commit -m "Projections $(TZ=America/Chicago date +'%a %F %H:%M')" || echo "nothing new"
          git push